<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GlucoInsight прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: sticky scenario stepper on top, one "screen" below; doctor screens look like a MIS panel, patient screens are a phone with a side panel */
:root{
  --bg:#EEF3F4; --surface:#FFFFFF; --surface-2:#F5F8F9; --line:#D5DFE2;
  --ink:#12232A; --muted:#566A72; --accent:#0B7480; --accent-ink:#FFFFFF; --accent-soft:#DDF0F1;
  --violet:#5B45C9; --violet-soft:#ECE8FB;
  --ok:#1D7F4E; --ok-soft:#E1F3E8; --warn:#9A6500; --warn-soft:#FBF0D9; --bad:#B23A35; --bad-soft:#FBE5E3;
  --tube-edta:#8E6BBF; --tube-flu:#8A9299; --tube-sst:#D9A21B;
  --chat:#E9E5F7; --phone:#1B1530; --scrim:rgba(5,10,20,.55);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1A1F; --surface:#15252B; --surface-2:#1A2C33; --line:#2A3F47;
  --ink:#E4EEF0; --muted:#97AAB1; --accent:#38B3BE; --accent-ink:#06191C; --accent-soft:#163B40;
  --violet:#A493F2; --violet-soft:#2A2448;
  --ok:#5BC98E; --ok-soft:#163626; --warn:#E6B04A; --warn-soft:#3A2E14; --bad:#F08A84; --bad-soft:#3E1D1B;
  --chat:#2A2448; --phone:#07050D; --scrim:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1A1F; --surface:#15252B; --surface-2:#1A2C33; --line:#2A3F47;
  --ink:#E4EEF0; --muted:#97AAB1; --accent:#38B3BE; --accent-ink:#06191C; --accent-soft:#163B40;
  --violet:#A493F2; --violet-soft:#2A2448;
  --ok:#5BC98E; --ok-soft:#163626; --warn:#E6B04A; --warn-soft:#3A2E14; --bad:#F08A84; --bad-soft:#3E1D1B;
  --chat:#2A2448; --phone:#07050D; --scrim:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo i{width:12px;height:22px;border-radius:3px 3px 6px 6px;background:linear-gradient(var(--tube-edta) 0 30%,var(--accent-soft) 30%);border:1.5px solid var(--accent);display:inline-block}
.brand-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.demo-tag{font-size:12px;color:var(--muted)}
.sus-btn{border:1.5px solid var(--ok);background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 9px;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.step b{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap}
.step span{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step i{font-style:normal;font-size:11px;color:var(--muted)}
.step[aria-current="step"]{border-color:var(--accent);background:var(--accent-soft)}
.step[aria-current="step"] b{color:var(--accent)}
.step.done b::after{content:" ✓";color:var(--ok)}

main .wrap{padding-block:20px 120px}
.screen-in{display:flex;flex-direction:column;gap:16px}
.lead{display:flex;flex-direction:column;gap:4px;max-width:72ch}
.lead h1{font-family:var(--f-display);font-weight:600;font-size:clamp(19px,3.2vw,26px);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lead p{margin:0;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.who.pat{color:var(--violet)}

/* MIS panel */
.mis{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mis-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.mis-bar strong{color:var(--ink);font-weight:600}
.counters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding:14px}
@media (max-width:720px){.counters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.counter{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.counter em{font-style:normal;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.counter small{color:var(--muted);font-size:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}
.list{display:flex;flex-direction:column}
.row,.head-row{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1.55fr) minmax(0,1.2fr) 92px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row{text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.row:hover{background:var(--surface-2)}
.row.hl{background:var(--accent-soft)}
.row[data-locked]{cursor:default}
.row .nm{font-weight:600}
.row .nm small,.row .why small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.row .why{font-size:13px;min-width:0}
.row .go{color:var(--accent);font-weight:600;font-size:13px;white-space:nowrap}
.head-row{padding-block:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{padding:18px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
.tube{display:inline-flex;align-items:center;gap:6px}
.tube::before{content:"";width:8px;height:14px;border-radius:2px 2px 4px 4px;background:var(--cap,var(--tube-sst));flex:none}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.none{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.wait{background:var(--accent-soft);color:var(--accent)}
.pill.late{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
@media (max-width:720px){
  .head-row{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm go" "why why" "st st";gap:6px 10px}
  .row .nm{grid-area:nm}.row .why{grid-area:why}.row .st{grid-area:st}.row .go{grid-area:go}
}
@media (max-width:620px){.step span{display:none}.step b{font-size:12px}.steps{gap:4px}.step{padding:7px 6px}}

/* patient card */
.card-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;padding:16px}
@media (max-width:820px){.card-grid{grid-template-columns:minmax(0,1fr)}}
.block{display:flex;flex-direction:column;gap:10px;min-width:0}
.block h3{margin:4px 0 0;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.results{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.res:first-child{border-top:0}
.res .ref{color:var(--muted);font-size:12px}
.res .r{text-align:right}
.res .prev{display:block;color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.hi{color:var(--bad);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip small{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.violet{background:var(--violet);color:#fff}
.note{font-size:13px;color:var(--muted);margin:0}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0}

/* sustainable element */
.ethic{border:1.5px solid var(--ok);background:var(--ok-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ethic.no{border-color:var(--warn);background:var(--warn-soft)}
.ethic-h{display:flex;align-items:center;gap:8px;font-weight:600;flex-wrap:wrap}
.leaf{width:18px;height:18px;flex:none}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13px}
.cols ul,.ethic ul{margin:4px 0 0;padding-left:18px}
.cols b{font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.preview{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.marker{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--ok);color:var(--surface);white-space:nowrap}
.marker.fbm{background:var(--violet)}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.roles{grid-template-columns:minmax(0,1fr)}}
.role{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.role b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

/* phone */
.patient{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:760px){.patient{grid-template-columns:minmax(0,1fr)}}
.phone{background:var(--phone);border-radius:34px;padding:12px;max-width:340px;width:100%;margin:0 auto;box-shadow:0 18px 40px -20px rgba(20,10,60,.55)}
.screen{background:var(--surface);border-radius:24px;overflow:hidden;min-height:600px;display:flex;flex-direction:column;position:relative;font-size:14px}
.screen.big{font-size:17px}
.screen.big .msg,.screen.big .actions button,.screen.big .opt{font-size:17px}
.chat-top{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chat-top .grow{flex:1;min-width:0}
.ava{width:34px;height:34px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.chat-top small{display:block;color:var(--muted);font-size:11px}
.aa{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 8px;font-weight:700;font-size:13px}
.aa[aria-pressed="true"]{border-color:var(--violet);color:var(--violet);background:var(--violet-soft)}
.chat{flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface-2)}
.msg{background:var(--chat);border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:14px;max-width:92%}
.msg.me{align-self:flex-end;background:var(--violet);color:#fff;border-radius:14px 14px 4px 14px}
.msg time{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.msg.me time{color:rgba(255,255,255,.75)}
.actions{display:flex;flex-direction:column;gap:6px}
.actions button{border:1px solid var(--violet);background:var(--surface);color:var(--violet);border-radius:10px;padding:9px;font-weight:600;font-size:14px}
.actions button.pri{background:var(--violet);color:#fff}
.actions button[disabled]{opacity:.45;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px;font-family:var(--f-mono);font-size:13px}
.slots button[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.slots button[disabled]{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.sheet{position:absolute;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 30px -12px rgba(0,0,0,.35)}
.sheet h4{margin:0;font-size:15px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.app-body{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.app-body h4{margin:0;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.opt{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;font-size:14px;width:100%}
.opt small{color:var(--muted);font-size:12px}
.opt .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:11px;font-weight:600;border-radius:5px;padding:1px 6px;background:var(--ok-soft);color:var(--ok)}
.opt[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{margin-top:3px;accent-color:var(--violet);width:16px;height:16px;flex:none}
.prep{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.prep ul{margin:4px 0 0;padding-left:18px}

/* result */
.spark{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.spark svg{width:220px;height:84px;max-width:100%}
.report{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.report{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* quick feedback strip */
.quick{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--violet);border-radius:var(--r);padding:10px 14px;background:var(--surface)}
.quick span{font-size:14px;font-weight:500}
.quick .chip[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.quick textarea{min-height:60px}
.quick .full{flex-basis:100%;display:flex;flex-direction:column;gap:8px}

/* feedback */
.fb-fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:999px;background:var(--violet);color:#fff;padding:12px 18px;font-weight:600;box-shadow:0 10px 24px -10px rgba(40,20,120,.6);display:flex;align-items:center;gap:8px}
.fb{background:var(--surface);border:1.5px solid var(--violet);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.fb h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.q{display:flex;flex-direction:column;gap:6px}
.q>label,.q>span{font-weight:600;font-size:14px}
.stars{display:flex;gap:6px;flex-wrap:wrap}
.stars button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-family:var(--f-mono);font-size:15px}
.stars button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--surface-2);color:var(--ink);resize:vertical}
.fb .chip[aria-pressed="true"]{border-color:var(--violet);background:var(--violet-soft);color:var(--violet)}
.thanks{display:flex;flex-direction:column;gap:6px}
.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.overlay>.fb,.overlay>.drawer{max-width:560px;width:100%;max-height:calc(100% - 20px);overflow:auto}
.drawer{background:var(--surface);border:1.5px solid var(--ok);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.drawer h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.sus-list{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.sus-list li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sus-list .t{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:600}
.sus-list .k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ok)}
.x{align-self:flex-end;border:0;background:none;color:var(--muted);font-size:14px;padding:0}
.msg .trust{display:flex;gap:6px;align-items:flex-start;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.86em;color:var(--ok)}
.msg .trust svg{flex:none;margin-top:2px}
.consent{position:fixed;left:12px;right:12px;bottom:12px;z-index:60;max-width:640px;margin:0 auto;background:var(--surface);color:inherit;border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:14px}
.consent p{margin:0}.consent-b{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.screen-in{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="logo"><i aria-hidden="true"></i>GlucoInsight</div>
      <div class="brand-r">
        <span class="demo-tag">Прототип одного сценарію · демо-дані, усі пацієнти вигадані</span>
        <button class="sus-btn" id="susOpen" type="button" aria-haspopup="dialog"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M5 19c0-8 5-13 15-14-1 10-6 15-14 15"/><path d="M5 19l7-7"/></svg>Сталі елементи · 7</button>
      </div>
    </div>
    <nav class="steps" id="steps" aria-label="Кроки сценарію"></nav>
  </div>
</header>

<main><div class="wrap" id="app"></div></main>

<button class="fb-fab" id="fab" type="button" aria-haspopup="dialog">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Залишити відгук
</button>
<div id="modal"></div>

<script>
(function(){
/* ===== Модуль 4: A/B-тест і аналітика =====
   Вставте сюди URL веб-застосунку Apps Script (закінчується на /exec). */
const GAS_URL='https://script.google.com/macros/s/AKfycbyK8Zq6SQApsNN6P03FVl_i5nGL70Tf3XSxO9G-d8GBj1ILL270u_WUnxObr_vLRW1cCA/exec';
const QS=new URLSearchParams(location.search);

function track(type,o){
  o=o||{};

    type:type,step:o.step!=null?o.step:curStep+1,label:o.label||'',value:o.value!=null?String(o.value).slice(0,2000):'',ms:o.ms||'',data:o.data||null});

}
function flush(final){
  if(CONSENT==='no'){ Q=[]; return; }
  if(CONSENT!=='yes'){ if(Q.length>300) Q=Q.slice(-300); return; }
  if(!Q.length) return; const batch=Q; Q=[];

  try{ fetch(GAS_URL,{method:'POST',mode:'no-cors',keepalive:body.length<60000,headers:{'Content-Type':'text/plain;charset=utf-8'},body:body}).catch(()=>{}); }

}

}

let dbP=null; function getDb(){ if(!dbP){ dbP=(window.claude&&window.claude.use)?window.claude.use('db').catch(()=>null):Promise.resolve(null);} return dbP;}
async function store(rec){
  let saved=false;
  try{ const db=await Promise.race([getDb(),new Promise(r=>setTimeout(()=>r(null),4000))]); if(db){ const u=await window.claude.use('user'); const id=u&&await u.id(); if(id){ await db.collection('feedback/'+id+'/items').add(rec); saved=true; } } }catch(e){ saved=false; }
  if(!saved){ try{ const k='gi-feedback'; const a=JSON.parse(localStorage.getItem(k)||'[]'); a.push(rec); localStorage.setItem(k,JSON.stringify(a)); }catch(e){} }
  return saved;
}
async function sendFb(){
  const f=S.fb; const t=document.getElementById('fbText'); if(t) f.text=t.value.slice(0,2000);
  const rec={kind:'form',rating:f.rating,role:f.role||'—',wouldUse:f.use||'—',hardestStep:f.hard||'—',susImportance:f.sus||'',disappointed:f.pmf||'—',comment:f.text,step:STEPS[S.step][1],at:new Date().toISOString()};
  track('feedback_form',{label:'form',value:f.text,data:rec}); flush();
  const saved=await store(rec);
  f.sent=true; f.where=saved?'Відгук збережено, команда його прочитає.':'Відгук прийнято.';
  refreshFb();
}
async function sendQuick(v,text){
  const k=S.step; S.quick[k]={v,text,sent:true}; render();
  track('feedback_quick',{step:k+1,label:v,value:text||'',data:{kind:'quick',clear:v,comment:text||''}}); flush();
  await store({kind:'quick',screen:STEPS[k][1],clear:v,comment:text||'',at:new Date().toISOString()});
}

document.addEventListener('input',e=>{
  if(e.target.id==='fbText') S.fb.text=e.target.value;
  if(e.target.id==='quickText'){ const q=S.quick[S.step]||(S.quick[S.step]={}); q.text=e.target.value; }
});
document.addEventListener('change',e=>{ if(e.target.id==='paper'){ S.paper=e.target.checked; track('click',{label:'paper:'+(S.paper?'on':'off')}); } });
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  { nClicks++; const k=Object.keys(d)[0]; const lbl=b.id||(k?k+':'+d[k]:'button');
    track('click',{label:lbl,value:(b.textContent||'').trim().slice(0,60)});
    if(S.step===2&&!S.optedOut&&(d.step==='3'||b.id==='snooze'||b.id==='why'||b.id==='optOut')) track('reminder_action',{label:d.step==='3'?'book':b.id});
    const si=SUS_ACT[b.id]!=null?SUS_ACT[b.id]:(d.branch==='b3'?5:null);
    if(si!=null) track('sus_use',{label:SUS[si][1],value:si});
    if(b.id==='susOpen') track('sus_open');
    if(d.sus!==undefined) track('sus_show',{label:SUS[+d.sus][1],value:d.sus});
    if(b.id==='book') track('booked',{label:S.branch,value:S.paper?'paper':'paperless'});
  }
  if(b.id==='fab'){openModal('fb');return;}
  if(b.id==='susOpen'){openModal('sus');return;}
  if(b.id==='fbClose'||b.id==='modalClose'){closeModal();return;}
  if(d.sus!==undefined){const s=SUS[+d.sus]; closeModal(); if(s[4]){S.pid=s[4];} if(s[3]>=2&&!S.assigned){S.assigned=true;S.pid='p1';} if(s[3]===2){S.whySheet=false;} go(s[3]); return;}
  if(d.rate){S.fb.rating=+d.rate;refreshFb();return;}
  if(d.role){S.fb.role=d.role;refreshFb();return;}
  if(d.use){S.fb.use=d.use;refreshFb();return;}
  if(d.hard){S.fb.hard=d.hard;refreshFb();return;}
  if(d.susrate){S.fb.sus=+d.susrate;refreshFb();return;}
  if(d.pmf){S.fb.pmf=d.pmf;refreshFb();return;}
  if(b.id==='fbSend'){b.disabled=true;sendFb();return;}
  if(b.id==='fbAgain'){S.fb={rating:0,role:'',use:'',hard:'',sus:0,pmf:'',text:'',sent:false,where:''};refreshFb();return;}
  if(d.quick){ if(d.quick==='yes'){sendQuick('yes');} else { S.quick[S.step]=Object.assign(S.quick[S.step]||{},{v:'no'}); render(); } return;}
  if(b.id==='quickSend'){ const t=document.getElementById('quickText'); sendQuick('no',t?t.value.slice(0,1000):''); return;}
  if(d.step!==undefined){ const n=+d.step; if(n>=2&&!S.assigned){S.assigned=true;S.pid='p1';} go(n); return;}
  if(d.filter){S.filter=d.filter;render();return;}
  if(d.open){ if(d.locked){ return; } S.pid=d.open; go(1); return;}
  if(d.test){const i=S.tests.indexOf(d.test); i<0?S.tests.push(d.test):S.tests.splice(i,1); render(); return;}
  if(d.term){S.term=+d.term;render();return;}
  if(b.id==='assign'){S.assigned=true;S.pid='p1';go(2);return;}
  if(b.id==='askConsent'){S.consentAsked=true;render();return;}
  if(b.id==='bigText'){S.big=!S.big;render();return;}
  if(b.id==='snooze'){S.snoozed=true;render();return;}
  if(b.id==='why'){S.whySheet=true;render();return;}
  if(b.id==='closeWhy'){S.whySheet=false;render();return;}
  if(b.id==='optOut'){S.optedOut=true;S.whySheet=false;render();return;}
  if(b.id==='undoOpt'){S.optedOut=false;S.snoozed=false;render();return;}
  if(d.branch){S.branch=d.branch;render();return;}
  if(d.day){S.day=d.day;S.slot=null;render();return;}
  if(d.slot){S.slot=d.slot;render();return;}
  if(b.id==='book'){S.booked=true;render();return;}
  if(b.id==='rebook'){S.booked=false;render();return;}
  if(b.id==='nextCtl'){S.nextCtl=true;render();return;}
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

const m=/^#s([1-5])$/.exec(location.hash||'');
if(m){ S.step=+m[1]-1; if(S.step>=2){S.assigned=true;} if(S.step===4){S.slot='08:00';S.booked=true;} }
render();
})();
</script>
</body>
</html>
